services:
  qianji:
    # Pin the upstream source revision reviewed on 2026-11-11.
    image: ghcr.io/fangzhengjin/qianji-mcp:74a8b17
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .private/upstream.env
    volumes:
      - qianji_data:/data

volumes:
  qianji_data:
